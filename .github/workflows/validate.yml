name: validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-easyconfig:
    name: Check cvenv easyconfig and run tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/eessi/client:rocky8-amd64
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      HOME: ${{ github.workspace }}
      EASYBUILD_PREFIX: ${{ github.workspace }}/local-sw
      CV_ARCHIVE_DIR: ${{ github.workspace }}/cvenv-archives
    steps:
      - uses: actions/checkout@v4

      - name: Initialize EESSI
        run: |
          set -eo pipefail
          cvmfs_config chksetup
          mount -t cvmfs software.eessi.io /cvmfs/software.eessi.io
          source /cvmfs/software.eessi.io/versions/2025.06/init/lmod/bash
          module --version

          cat > /tmp/eessi-ci-env.sh <<'EOF'
          source /cvmfs/software.eessi.io/versions/2025.06/init/lmod/bash
          module load EasyBuild/5.4.1
          module load uv/0.7.13-GCCcore-14.2.0
          EOF
          chmod 0644 /tmp/eessi-ci-env.sh
          chown -R eessi:eessi "$GITHUB_WORKSPACE"
          runuser -u eessi -- env HOME="$HOME" USER=eessi bash -c '
            source /tmp/eessi-ci-env.sh
            module list
            eb --version
            uv --version
          '

      - name: Create archive and test directories
        run: |
          runuser -u eessi -- env HOME="$HOME" USER=eessi bash -c '
            mkdir -p "$CV_ARCHIVE_DIR" "$HOME/cvenv-test"
          '

      - name: Install Miniconda
        run: |
          runuser -u eessi -- env HOME="$HOME" USER=eessi bash -c '
            set -eo pipefail
            source /tmp/eessi-ci-env.sh
            eb Miniconda3-25.7.0-2.eb --robot
          '

      - name: Validate easyconfig
        run: |
          runuser -u eessi -- env HOME="$HOME" USER=eessi bash -c '
            set -eo pipefail
            source /tmp/eessi-ci-env.sh
            eb cvenv-0.1.0.eb --dry-run
          '

      - name: Install cvenv
        run: |
          runuser -u eessi -- env HOME="$HOME" USER=eessi bash -c '
            set -eo pipefail
            source /tmp/eessi-ci-env.sh
            eb cvenv-0.1.0.eb --robot
          '

      - name: E2E tests
        run: |
          runuser -u eessi -- env HOME="$HOME" USER=eessi bash -c '
            set -eo pipefail
            source /tmp/eessi-ci-env.sh
            module use "$EASYBUILD_PREFIX/modules/all"
            module load Miniconda3/25.7.0-2
            conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
            conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r
            module load cvenv/0.1.0

            cd "$HOME/cvenv-test"
            export CVENV_E2E_CONDA=1
            bash "$GITHUB_WORKSPACE/scripts/cvenv_e2e.sh"
          '
