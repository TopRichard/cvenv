name: cvenv functionality tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-easyconfig:
    name: Check cvenv easyconfig and run tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      EASYBUILD_PREFIX: ${{ github.workspace }}/sw
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up EESSI
        uses: eessi/github-action-eessi@v3
        with:
          eessi_stack_version: '2025.06'
          init_direnv: false

      - name: Verify EESSI access
        run: |
          set -euo pipefail
          test -d /cvmfs/software.eessi.io/versions/2025.06
          module --version

      - name: Validate cvenv easyconfig
        run: |
          set -euo pipefail
          module load EasyBuild/5.4.1
          eb cvenv-0.1.0.eb --dry-run

      - name: Install Miniconda for conda tests
        run: |
          set -euo pipefail
          module load EasyBuild/5.4.1
          eb Miniconda3-25.7.0-2.eb --robot

      - name: Load uv for cvenv tests
        run: |
          set -euo pipefail
          module load uv/0.7.13-GCCcore-14.2.0
          mkdir -p "$HOME/cvenv-test"
          uv --version

      - name: Install cvenv module
        run: |
          set -euo pipefail
          module load EasyBuild/5.4.1
          eb cvenv-0.1.0.eb --robot

      - name: Run cvenv functionality tests
        run: |
          set -euo pipefail
          module load uv/0.7.13-GCCcore-14.2.0
          module use "$EASYBUILD_PREFIX/modules/all"
          module load Miniconda3/25.7.0-2
          conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
          conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r
          module load cvenv/0.1.0

          cd "$HOME/cvenv-test"
          bash "$GITHUB_WORKSPACE/scripts/cvenv_e2e.sh"
